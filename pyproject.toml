[project]
dependencies = [
  "alembic>=1.19.0",
  "asyncpg>=0.31.0",
  "bcrypt>=5.0.0",
  "fastapi[standard]>=0.141.1",
  "greenlet>=3.5.4",
  "psycopg2-binary>=2.9.12",
  "pydantic>=2.13.4",
  "pyjwt>=2.13.0",
  "python-dotenv>=1.2.2",
  "sqlalchemy>=2.0.51",
]
description = "Take Home Challenge del Modulo 8"
name = "modulo-8"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.2"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"] # errores, pyflakes, orden de imports
